version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: expense-sharing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: expense_sharing_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-db:/docker-entrypoint-initdb.d
    networks:
      - expense-sharing-network

  # 将来的にバックエンドもDockerで実行する場合のための設定（コメントアウト）
  # backend:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   container_name: expense-sharing-backend
  #   restart: unless-stopped
  #   ports:
  #     - "4000:4000"
  #   environment:
  #     - DB_HOST=postgres
  #     - DB_PORT=5432
  #     - DB_USERNAME=postgres
  #     - DB_PASSWORD=password
  #     - DB_DATABASE=expense_sharing_app
  #   depends_on:
  #     - postgres
  #   networks:
  #     - expense-sharing-network

volumes:
  postgres_data:

networks:
  expense-sharing-network:
    driver: bridge